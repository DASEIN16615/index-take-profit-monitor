name: A-Share ETF Rotation Daily Monitor

on:
  schedule:
    # 避开 :30 拥堵高峰（GitHub Actions 免费池在 :00 和 :30 经常发生调度延迟或直接丢弃）
    # 改为北京时间 14:28 (UTC 06:28) 错峰准时触发，为尾盘留出充分决策时间
    - cron: '28 6 * * 1-5'
    # 14:38 (UTC 06:38) 冗余防漏跑触发
    - cron: '38 6 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run ignoring trading calendar filter (true/false)'
        required: false
        default: 'false'
        type: string

jobs:
  etf_monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Safeguards Unit Test Suite
        run: python test_safeguards.py

      - name: Run ETF Rotation Monitor
        run: python etf_rotation_monitor.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_CODE: ${{ secrets.SMTP_CODE }}
          SMTP_TO: ${{ secrets.SMTP_TO || secrets.SMTP_USER }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FORCE_RUN: ${{ inputs.force_run }}
