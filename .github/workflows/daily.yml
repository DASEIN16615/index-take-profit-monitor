name: index-take-profit-monitor

on:
  schedule:
    # 每天北京时间 09:00 (UTC 01:00) 自动触发推送
    - cron: '0 1 * * *'
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run index monitor
        run: python index_monitor.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_CODE: ${{ secrets.SMTP_CODE }}
