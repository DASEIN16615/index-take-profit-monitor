name: index-take-profit-monitor

on:
  # 由 Cloudflare Worker 准时在工作日/每日 09:00 调用 GitHub API 触发，杜绝 GitHub 原生 schedule 严重延迟（延时达数小时）的问题
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run index monitor
        run: python index_monitor.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_CODE: ${{ secrets.SMTP_CODE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
